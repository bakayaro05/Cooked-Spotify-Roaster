name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v3

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: wrapped-roaster

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: wrapped-roaster/dist

      - uses: actions/deploy-pages@v4
